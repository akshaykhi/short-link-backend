    url: jdbc:mysql://google/candidate_db?cloudSqlInstance=ltc-reboot25-team-57:us-central1:root&socketFactory=com.google.cloud.sql.mysql.SocketFactory
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.MySQL8Dialect

