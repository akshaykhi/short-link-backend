server:
  port: 8081
  error:
    include-message: always

runtime: java17  # or java21 if you're using Java 21

service: hackathon-api  # <-- Custom service name

instance_class: F1

isActive: true

resumes:
  path: E:\tmp\destination

spring:
  application:
    name: HackathonBE
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    url: jdbc:mysql://google/candidate_db?cloudSqlInstance=ltc-reboot25-team-57:us-central1:root&socketFactory=com.google.cloud.sql.mysql.SocketFactory
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.MySQL8Dialect

